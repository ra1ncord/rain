name: Build rain.js

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ hashFiles('bun.lock') }}

      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest dist/rain.js dist/info.json dist/cheeseburger.js dist/cheeseburger.json addons/* \
            --title "Latest build ($(git rev-parse --short HEAD))" \
            --notes "Auto-built from ${{ github.sha }}" \
            --latest
